vendor_name: "Alliance Healthcare"
vendor_code: "alliance"

header:
  invoice_number:
    extraction_strategy: "keyword"
    keyword_search: "DAŇOVÝ DOKLAD - FAKTURA"
    pattern: "(\\d{9})"
    required: true
  
  issue_date:
    extraction_strategy: "keyword"
    keyword_search: "Datum vystavení faktury"
    pattern: "(\\d{2}\\.\\d{2}\\.\\d{4})"
    required: true
  
  due_date:
    extraction_strategy: "keyword"
    keyword_search: "Datum splatnosti"
    pattern: "(\\d{2}\\.\\d{2}\\.\\d{4})"
    required: true
  
  supply_date:
    extraction_strategy: "keyword"
    keyword_search: "Datum uskutečnění zdanitelného plnění"
    pattern: "(\\d{2}\\.\\d{2}\\.\\d{4})"
    required: true

  variable_symbol:
    extraction_strategy: "keyword"
    keyword_search: "variabilní symbol"
    pattern: "(\\d+)"
    required: false

supplier:
  name:
    extraction_strategy: "keyword"
    keyword_search: "Dodavatel"
    required: true

  address:
    extraction_strategy: "keyword"
    keyword_search: "Dodavatel"
    required: true
  
  ic:
    extraction_strategy: "keyword"
    keyword_search: "IČ"
    pattern: "IČ:\\s*(\\d{8})"
    required: true
  
  dic:
    extraction_strategy: "keyword"
    keyword_search: "DIČ"
    pattern: "DIČ:\\s*(CZ\\d{8,10})"
    required: true

vat_breakdown:
  rate_10_base:
    extraction_strategy: "keyword"
    keyword_search: "Z toho pro 2.daň 10%"
    pattern: "([\\d,]+\\.\\d{2})"
    required: true
  
  rate_10_vat:
    extraction_strategy: "keyword"
    keyword_search: "Z toho pro 2.daň 10%"
    pattern: "[\\d,]+\\.\\d{2}\\s*([\\d,]+\\.\\d{2})"
    required: true

total_amount:
  extraction_strategy: "keyword"
  keyword_search: "Celkem k úhradě CZK"
  pattern: "([\\d,]+\\.\\d{2})"
  required: true

